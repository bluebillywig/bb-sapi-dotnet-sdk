name: Publish to NuGet
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Trusted Publishing: NuGet.org exchanges the OIDC token for a short-lived API key
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release

      - name: Pack with version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          dotnet pack src/BlueBillywig.Sapi --no-build --configuration Release --output artifacts -p:Version="$VERSION"

      # Requires a Trusted Publishing policy on nuget.org for this repository + workflow file
      # (nuget.org > account > Trusted Publishing). No API key secret is stored in GitHub.
      - name: NuGet login (Trusted Publishing)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
